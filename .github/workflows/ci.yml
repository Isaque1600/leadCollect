name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared types
        run: pnpm --filter @olc/types build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  deploy-web:
    # Only after checks pass, and only on a real push to an env branch
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          HOOK_MAIN: ${{ secrets.VERCEL_DEPLOY_HOOK_MAIN }}
          HOOK_DEV: ${{ secrets.VERCEL_DEPLOY_HOOK_DEV }}
        run: |
          # A missing hook must FAIL, not skip. Skipping reported success while
          # the SPA silently stopped deploying — push-deploys are disabled in
          # apps/web/vercel.json, so this job is the only thing that ships it.
          case "$GITHUB_REF" in
            refs/heads/main) HOOK="$HOOK_MAIN"; NAME=VERCEL_DEPLOY_HOOK_MAIN ;;
            refs/heads/dev)  HOOK="$HOOK_DEV";  NAME=VERCEL_DEPLOY_HOOK_DEV ;;
            *) echo "::error::deploy-web ran on $GITHUB_REF, which has no deploy hook."; exit 1 ;;
          esac
          if [ -z "$HOOK" ]; then
            echo "::error::Repository secret $NAME is not set, so the SPA cannot deploy."
            echo "Set it with: gh secret set $NAME"
            echo "It must be a REPOSITORY secret — an environment secret is invisible"
            echo "to this job, which does not declare an environment."
            exit 1
          fi
          echo "Triggering Vercel deploy for $GITHUB_REF"
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Vercel accepted the deploy hook."
