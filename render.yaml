# Two fully separate environments, each its own Render service, branch, env
# vars and Neon database. See docs/adr/0007-dev-prod-environments.md.
#
# NOTE: these services were first created by hand in the dashboard. To bring
# them under this blueprint, either rename the existing services to match the
# names below, or delete them and re-sync the blueprint. Ticket 13 covers the
# reconciliation.
#
# NOTE: Auto-Deploy's "only deploy after CI checks pass" option must stay OFF
# on both services. It reads GitHub's classic commit-status API, but this
# repo's CI (.github/workflows/ci.yml) is a GitHub Actions workflow, which
# reports through the separate Checks API. Render never sees a passing check,
# so with that option on, dev/main pushes silently stop auto-deploying even
# though CI is green. main/dev only move via merged, CI-checked PRs anyway
# (see CLAUDE.md's git workflow), so plain Auto-Deploy-on-push is sufficient.
#
# NOTE: migrations run in the start command, not a Pre-Deploy Command (that is
# paid-only). apps/api/scripts/start.sh runs `pnpm run db:migrate` against
# DATABASE_URL_DIRECT, then execs `node dist/main.js`. If the migration fails,
# the script exits before the server starts, the health check never passes,
# and Render keeps the previous version live. `db:migrate` runs through `tsx`,
# a devDependency. It is present at runtime because the build installs
# devDependencies (`nest build` needs @nestjs/cli too) and Render does not
# prune them afterwards. Don't set NODE_ENV=production here: pnpm would skip
# devDependencies, which breaks the build and the migration alike. On a paid
# plan, move the migration to a Pre-Deploy Command and go back to `pnpm start`.

services:
  # --- production: tracks main ---
  - type: web
    name: leadCollect-Prod
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: apps/api
    buildCommand: pnpm install --frozen-lockfile; pnpm run build
    startCommand: sh scripts/start.sh # migrate, then exec the server (see the note above)
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CORS_ORIGINS
        sync: false # prod SPA origin (Vercel production URL)
      - key: DATABASE_URL
        sync: false # prod Neon pooled URL
      - key: DATABASE_URL_DIRECT
        sync: false # prod Neon direct URL (migrations)
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: WEB_APP_URL
        sync: false

  # --- development: tracks dev ---
  - type: web
    name: leadCollect-Dev
    runtime: node
    plan: free
    region: oregon
    branch: dev
    rootDir: apps/api
    buildCommand: pnpm install --frozen-lockfile; pnpm run build
    startCommand: sh scripts/start.sh # migrate, then exec the server (see the note above)
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CORS_ORIGINS
        sync: false # localhost:5173 + Vercel preview URL
      - key: DATABASE_URL
        sync: false # dev Neon pooled URL (separate database)
      - key: DATABASE_URL_DIRECT
        sync: false # dev Neon direct URL (migrations)
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: WEB_APP_URL
        sync: false
